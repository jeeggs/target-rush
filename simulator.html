<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0e17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Target Rush" />
  <meta name="description" content="A fast target-shooting game built for desktop and touch screens." />
  <title>Target Rush</title>
  <link rel="icon" href="www/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="www/icon.svg" />
  <link rel="manifest" href="www/manifest.webmanifest" />
  <link rel="stylesheet" href="www/style.css?v=7" />
</head>
<body>
  <main class="game-shell">
    <header>
      <div><p class="eyebrow">AIM TRAINER</p><h1>Target Rush</h1></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="Toggle sound">Sound: On</button>
    </header>
    <section class="stats" aria-label="Game statistics">
      <div><span>Score</span><strong id="score">0</strong></div>
      <div><span>Time</span><strong id="time">30</strong></div>
      <div><span>Accuracy</span><strong id="accuracy">—</strong></div>
      <div><span>Best</span><strong id="best">0</strong></div>
    </section>
    <section id="arena" class="arena" aria-label="Target shooting area">
      <div class="grid" aria-hidden="true"></div>
      <div id="target" class="target" role="button" aria-label="Target" hidden><span></span><span></span><span></span><span></span></div>
      <div id="startPanel" class="panel">
        <p class="panel-kicker">READY?</p>
        <h2 id="panelTitle">How quick are your reflexes?</h2>
        <p id="panelText">Tap every target before it moves. A miss costs one point.</p>
        <div id="difficultyPicker" class="difficulty" aria-label="Choose difficulty">
          <button class="difficulty-button selected" type="button" data-level="easy">Easy<small>Slow</small></button>
          <button class="difficulty-button" type="button" data-level="hard">Hard<small>Fast</small></button>
          <button class="difficulty-button" type="button" data-level="impossible">Impossible<small>Fastest</small></button>
        </div>
        <button id="startButton" class="start-button" type="button">Start Game</button>
      </div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </section>
    <footer id="installHint">On iPhone: Share → Add to Home Screen → Add</footer>
  </main>
  <script src="www/game.js?v=7"></script>
</body>
</html>
